<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/project-general-style.css">
    <title>Document</title>
</head>
<body>

    <div class="title">
        <h2>Verifications For Data</h2>
    </div>

    <div class="explain">

        <p>This is a simple example for data validation:</p>
        <br>

        <p>Data is sent by a form, captured and processed by the java servlet and then multiple verifications
            are made where the result of these will be seen in a new web page.
        </p>

    </div>

    <form action="/servlet/verifier" method="POST">

        <label>Age Verifier</label>
        <input type="text" name="age" placeholder="type a number" min="0" max="120">

        <label>Leap Verifier</label>
        <input type="text" name="year" placeholder="type a year">

        <label>Palindrome Verifier</label>
        <input type="text" name="palindrome" placeholder="type a word">

        <button type="submit"> Submit Data </button>

    </form>
    
</body>
</html>
